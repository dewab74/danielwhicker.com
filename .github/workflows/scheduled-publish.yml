# GitHub Pages leaves future-dated posts out of a build and does not rebuild on
# its own. This asks for a rebuild each morning so they appear on their date,
# then announces anything new or edited to search engines that use IndexNow.
name: Scheduled publish

on:
  schedule:
    - cron: "17 15 * * *"  # daily, a little after 09:00 US Central
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Request a Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"

      - uses: actions/checkout@v4

      - name: Wait for the build to go out
        run: sleep 240

      - name: Tell IndexNow search engines about new or edited pages
        run: python3 scripts/indexnow.py
