{%- comment -%}
    Artwork banner. Always dark (a nested theme wrapper), so the artwork reads the same
    whichever colour scheme the page follows. Usage:
    {% include hero.html title="..." lede="..." %}
{%- endcomment -%}
<section class="hero twilight-theme" data-theme="dark" aria-labelledby="hero-title">
    <div class="hero-inner">
        <h1 id="hero-title">{{ include.title }}</h1>
        {% if include.lede %}<p>{{ include.lede }}</p>{% endif %}
    </div>
</section>
