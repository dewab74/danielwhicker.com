<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title and page.url != '/' %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="color-scheme" content="dark light">
    <link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23050F2D'/%3E%3Cg transform='translate(4 4) scale(.667)' fill='none' stroke='%2322D3EE' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 10V2'/%3E%3Cpath d='m4.93 10.93 1.41 1.41'/%3E%3Cpath d='M2 18h2'/%3E%3Cpath d='M20 18h2'/%3E%3Cpath d='m19.07 10.93-1.41 1.41'/%3E%3Cpath d='M22 22H2'/%3E%3Cpath d='m16 6-4 4-4-4'/%3E%3Cpath d='M16 18a4 4 0 0 0-8 0'/%3E%3C/g%3E%3C/svg%3E">
    <link rel="preload" href="{{ '/assets/theme/fonts/inter/inter-latin-wght-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ '/assets/theme/css/fonts.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/theme/css/theme.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body class="twilight-theme" data-theme="system">
<a class="skip-link" href="#content">Skip to content</a>
<header class="site-header">
    <div class="wrap site-header-inner">
        <a class="brand site-brand" href="{{ '/' | relative_url }}">{% include icon.html name="sunset" %}<span>{{ site.title | escape }}</span></a>
        <nav class="site-nav" aria-label="Primary">
            <a href="{{ '/' | relative_url }}"{% if page.url == '/' or page.layout == 'post' %} aria-current="page"{% endif %}>Writing</a>
            <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
            <a href="{{ '/feed.xml' | relative_url }}">Feed</a>
        </nav>
    </div>
</header>

<main id="content">
{{ content }}
</main>

<footer class="site-footer">
    <div class="wrap">&copy; {{ 'now' | date: '%Y' }} Daniel Whicker. Opinions are my own.</div>
</footer>
</body>
</html>
